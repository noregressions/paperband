title: "Paperband Guide"
theme: editorial

# The section axis makes vars.section available in each card's template context.
# Note: static-site section grouping is driven by folder path (LayoutEngine.sectionIdFor),
# not by this axis value. The axis is declared here to document how axes work.
axes:
  - name: section
    title: "Guide Section"
    values:
      - id: getting-started
        label: "Getting Started"
      - id: authoring
        label: "Authoring"
      - id: configuration
        label: "Configuration"
      - id: rendering
        label: "Rendering"
      - id: advanced
        label: "Advanced"

# The book's sheet. Book scope: one book is printed on one page size, so this
# is read from THIS file only — a folder yaml may set page.orientation (which
# rotates that folder's cards) but not size or margins.
page:
  margins: { top: 20, right: 18, bottom: 20, left: 18 }

css:
  - styles/guide.css

# The static site's navigation sidebar. Book scope, like every other key at
# this level: the site has one sidebar or none, so a folder yaml declaring it
# is an error rather than a walk-order coin flip.
sidebar: true

vars:
  author: "The Paperband Team"
  version: "0.1.0-SNAPSHOT"
  subtitle: "A self-documenting reference built with Paperband itself"
  series: "Paperband Documentation"
  # Printed table of contents and back-of-book index -- both live demos of
  # the features documented in Book Configuration / TOC and Index.
  toc: true
  index: auto
  # Vetoes for auto picks that are frequent-but-generic in this guide.
  # Review the picks with `mvn paperband:structure -Dpaperband.input=guide`.
  indexStop: [model, static, open, nested, group, front, new, file, goal,
              pattern, Add, Changed, downloads, innermost, terms, numbers,
              margin, limit, guide]
