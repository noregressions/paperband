<!DOCTYPE html>
<html>
<head>
  <!-- An .html card: <head> metadata is its frontmatter, <body> its content.
       https://noregressions.github.io/paperband/cards/html-cards.html -->
  <title>An HTML Card</title>
  <meta name="id" content="html-card">
  <meta name="oneliner" content="A card written as HTML: the head is its frontmatter.">
</head>
<body>
  <p>This card is an HTML file. Its headings still become blocks, and a class survives the
  content policy while an inline <code>style=</code> would be stripped.</p>
  <h2>A table with a spanning cell</h2>
  <table class="demo-table">
    <tr><th rowspan="2">Format</th><td>Markdown</td></tr>
    <tr><td>HTML</td></tr>
  </table>
</body>
</html>
